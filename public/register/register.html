<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Saver - Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="register">
        <h1>Register</h1>
        <label for="userid">User ID</label>
        <input type="text" id="userid" name="userid">
        <br><br>
        <label for="passwd">Password</label>
        <input type="password" id="passwd" name="passwd">
        <br><br>
        <label for="confirm-passwd">Confirm Password</label>
        <input type="password" id="confirm-passwd" name="confirm-passwd">
        <br><br>
        <button id="accept">Register</button>
        <br><br>
        <a href="../index.html" id="newuser" class="btn">Or click here if you have an account already.</a>
    </div>
    
    <script src="register.js"></script>
</body>
</html>
